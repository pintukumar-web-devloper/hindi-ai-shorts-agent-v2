
name: Agnes Flash Test

on:
  workflow_dispatch:

jobs:
  test-video:
    runs-on: ubuntu-latest
    steps:
      - name: Generate 5-second Shera Bhai video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          api_key = os.environ.get("AGNES_API_KEY")
          if not api_key:
              raise RuntimeError("AGNES_API_KEY secret is missing")

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json"
          }

          payload = {
              "model": "agnes-video-2.5-flash",
              "prompt": "A majestic anthropomorphic white lion wearing a luxurious white three-piece suit and black sunglasses walks confidently beside a beautiful royal palace. Natural walking animation, cinematic camera movement, realistic fur motion, vertical video.",
              "seconds": "5",
              "mode": "text",
              "size": "720P",
              "aspect_ratio": "9:16"
          }

          print("Sending video request to Agnes...")

          response = requests.post(
              "https://apihub.agnes-ai.com/v1/videos",
              headers=headers,
              json=payload,
              timeout=60
          )

          print("HTTP Status:", response.status_code)
          print("API Response:", response.text[:2000])

          response.raise_for_status()
          data = response.json()
          video_id = data.get("video_id")

          if not video_id:
              raise RuntimeError(f"video_id missing: {data}")

          print("Video task created:", video_id)

          for attempt in range(60):
              result = requests.get(
                  "https://apihub.agnes-ai.com/agnesapi",
                  headers=headers,
                  params={
                      "video_id": video_id,
                      "model_name": "agnes-video-2.5-flash"
                  },
                  timeout=60
              )

              print("Polling HTTP Status:", result.status_code)
              result.raise_for_status()

              status_data = result.json()
              status = status_data.get("status")

              print(
                  "Video Status:", status,
                  "Progress:", status_data.get("progress")
              )

              if status == "completed":
                  url = status_data.get("url")
                  if not url:
                      raise RuntimeError("Video URL missing")

                  video = requests.get(url, timeout=120)
                  video.raise_for_status()

                  with open("shera-test.mp4", "wb") as f:
                      f.write(video.content)

                  print("Video downloaded successfully!")
                  break

              if status == "failed":
                  raise RuntimeError(f"Generation failed: {status_data}")

              time.sleep(2)
          else:
              raise TimeoutError("Video generation timed out")
          PY

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: shera-test-video
          path: shera-test.mp4
          
