
name: Shera Bhai Daily Ideas

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  create-idea:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Shera Bhai Video Idea
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent"

          prompt = """
          Tum Shera Bhai YouTube Shorts channel ke creative director ho.

          MAIN CHARACTER:
          Shera Bhai ek bahut ameer, royal, powerful aur intelligent lion hai.
          Woh insaano ki tarah bolta hai, business karta hai aur badi-badi
          boliyan lagata hai.

          VIDEO IDEAS:
          - Poori nadi ko sone se bhar dena.
          - Ek poora mahal heere se banwana.
          - Duniya ki sabse mehengi cheez kharidne ki boli lagana.
          - Aise extraordinary aur entertaining challenges.

          RULES:
          1. Har din ek naya original idea.
          2. 45-60 second ki Hindi Shorts script.
          3. First 3 seconds mein powerful hook.
          4. 6-8 cinematic scenes.
          5. Har scene ke liye detailed visual prompt.
          6. Shera Bhai ka look har scene mein consistent ho.
          7. Hindi dialogues aur voiceover.
          8. Interesting ending aur audience engagement.
          9. Title, description, hashtags aur thumbnail prompt.
          10. Kisi existing creator ki script copy mat karna.

          Output simple Hindi mein do.
          """

          data = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(data).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  result = json.loads(response.read())

              idea = result["candidates"][0]["content"]["parts"][0]["text"]

              with open("shera-idea.md", "w", encoding="utf-8") as f:
                  f.write(idea)

              print("Shera Bhai idea generated successfully!")

          except urllib.error.HTTPError as e:
              print("API ERROR:", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY

      - name: Save Shera Bhai Idea
        uses: actions/upload-artifact@v4
        with:
          name: shera-bhai-daily-idea
          path: shera-idea.md
          
